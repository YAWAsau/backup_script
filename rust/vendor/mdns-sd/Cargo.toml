[package]
edition = "2018"
rust-version = "1.71.0"
name = "mdns-sd"
version = "0.21.7"
authors = ["Han Xu <keepsimple@gmail.com>"]
build = false
exclude = ["fuzz"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "mDNS Service Discovery library with no async runtime dependency"
documentation = "https://docs.rs/mdns-sd"
readme = "README.md"
keywords = [
    "mdns",
    "service-discovery",
    "zeroconf",
    "dns-sd",
]
categories = ["network-programming"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/keepsimple1/mdns-sd"

[features]
async = ["flume/async"]
default = [
    "async",
    "logging",
]
logging = ["log"]
serde = ["dep:serde"]
unstable-fuzz-api = []

[lib]
name = "mdns_sd"
path = "src/lib.rs"

[[example]]
name = "query"
path = "examples/query.rs"

[[example]]
name = "register"
path = "examples/register.rs"

[[test]]
name = "addr_parse"
path = "tests/addr_parse.rs"

[[test]]
name = "mdns_test"
path = "tests/mdns_test.rs"

[[test]]
name = "shutdown_test"
path = "tests/shutdown_test.rs"

[dependencies]
