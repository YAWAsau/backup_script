[package]
name = "speedbackup-native-rs"
version = "930.0.0"
edition = "2021"
autobins = false
license = "GPL-3.0-only"

# No third-party crates. Android builds do not need network access.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[[bin]]
name = "speednative"
path = "src/main.rs"
