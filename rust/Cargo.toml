[package]
name = "speedbackup-native-rs"
version = "1102.0.0"
edition = "2021"
autobins = false
license = "GPL-3.0-only"

# Dependencies are locked and vendored for offline Android builds.
[dependencies]
serde = "=1.0.229"
serde_json = { version = "=1.0.154", features = ["raw_value"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[[bin]]
name = "speednative"
path = "src/main.rs"
