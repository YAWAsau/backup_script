name: Android checks and build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Source, shell syntax and runtime SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install mksh
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y mksh
      - name: Check source and committed tools
        run: python ci/check_repository.py check --shells

  android-build:
    name: Android arm64 Dex and Rust
    needs: source-checks
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-windows-jdk17-${{ hashFiles('dex/**/*.gradle.kts', 'dex/**/*.toml', 'dex/**/gradle-wrapper.properties') }}
          restore-keys: gradle-windows-jdk17-
      - name: Build and package checked Android artifacts
        run: |
          New-Item -ItemType Directory -Path ci-output -Force | Out-Null
          & pwsh -NoProfile -File ./ci/build_android.ps1 *>&1 | Tee-Object -FilePath ci-output/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload matching runtime and source snapshot
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: speedbackup-android-${{ github.sha }}
          path: |
            ci-output/SpeedBackup_*_CI_RUNTIME.zip
            ci-output/SpeedBackup_*_SOURCE_SNAPSHOT.zip
            ci-output/SHA256SUMS.txt
            ci-output/BUILD_INFO.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-build-log-${{ github.sha }}
          path: ci-output/build.log
          if-no-files-found: warn
          retention-days: 14
